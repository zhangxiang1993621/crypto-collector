name: Crypto Collector

on:
  schedule:
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  - cron: '0 0 * * *'
  workflow_dispatch: null

jobs:
  # ══════════════ httpx-only jobs ══════════════
  price_collector:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - name: Install
      run: pip install -r requirements.txt
    - name: Run
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        COINCAP_API_KEY: ${{ secrets.COINCAP_API_KEY }}
      run: python crypto/price_collector.py

  airdrop:
    runs-on: ubuntu-latest
    steps:
    - {uses: actions/checkout@v4}
    - {uses: actions/setup-python@v5, with: {python-version: '3.11'}}
    - {run: pip install -r requirements.txt}
    - name: Run
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        POSTS_AUTHOR_USERNAME: ${{ vars.POSTS_AUTHOR_USERNAME }}
        HOT_TOKENS_CATEGORY_NAME: ${{ vars.HOT_TOKENS_CATEGORY_NAME }}
      run: python crypto/airdrop_scraper.py --save --max 20

  indo_news:
    runs-on: ubuntu-latest
